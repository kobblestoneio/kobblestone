apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    operator: kobblestone
  name: bots.kobblestone.io
spec:
  conversion:
    strategy: None
  group: kobblestone.io
  names:
    kind: Bot
    listKind: BotList
    plural: bots
    singular: bot
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.auth.accountRef.name
      name: Account
      priority: 0
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          A `Bot` represents a single instance of a Minecraft bot.

          If the `Bot` should connect to an online server, it needs to reference an authorized `Account` (which is allowed to access the server).

          The logic of `Bot`s is programmed by the `BotBehavior`s they are referencing (`behaviors`).
        properties:
          spec:
            properties:
              auth:
                description: |-
                  Configures authentication for online servers.

                  If not specified, the `Bot` can only connect to offline servers.
                nullable: true
                properties:
                  accountRef:
                    description: |-
                      Reference to an `Account` object this `Bot` will use for authentication.

                      **Note**: The `Account` has to be authorized (`status.phase=Authorized`), otherwise the server connection will fail.
                    properties:
                      name:
                        type: string
                    type: object
                  enableChatSigning:
                    description: |-
                      If enabled, profile certificates from the referenced `Account` will be used to sign chat messages.

                      Default is `false`.
                    nullable: true
                    type: boolean
                required:
                - accountRef
                title: Authentication
                type: object
              behaviors:
                description: Behaviors that should apply to this `Bot`.
                items:
                  properties:
                    behaviorRef:
                      description: Reference to the `BotBehavior` object.
                      properties:
                        name:
                          type: string
                      type: object
                    parameters:
                      additionalProperties:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      description: Parameters forwarded to the `BotBehavior`.
                      nullable: true
                      type: object
                  required:
                  - behaviorRef
                  type: object
                nullable: true
                title: Behavior
                type: array
              inactive:
                description: |-
                  Whether the `Bot` should be inactive (not running).

                  Default is `false`.
                nullable: true
                type: boolean
              offlineUsername:
                description: |-
                  Username of the `Bot` when connecting without authentication (offline).

                  Default is `Player`.
                nullable: true
                type: string
              pod:
                description: Configures the spec of the managed `Pod` object.
                nullable: true
                properties:
                  affinity:
                    externalDocs:
                      url: https://kubernetes.io/docs/reference/kubernetes-api/core/pod-v1/#Affinity
                    nullable: true
                    properties:
                      nodeAffinity:
                        properties:
                          preferredDuringSchedulingIgnoredDuringExecution:
                            items:
                              properties:
                                preference:
                                  properties:
                                    matchExpressions:
                                      items:
                                        properties:
                                          key:
                                            type: string
                                          operator:
                                            type: string
                                          values:
                                            items:
                                              type: string
                                            type: array
                                        type: object
                                      type: array
                                    matchFields:
