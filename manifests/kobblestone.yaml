          against online Minecraft servers.\r\nThey can be referenced by `Bot`s to
          connect to online servers.\r\n\r\nOnce an `Account` is created, an authorization
          flow (OAuth device flow) is initiated.\r\nThe field `status.deviceFlow`
          will contain all necessary information for users to complete the authorization.\r\n\r\nOnce
          authorization is completed, the `Account` will store access and refresh
          tokens securely within a managed `Secret`. \r\n\r\n`Account`s automatically
          refresh their session before it expires for as long as the authorization
          state is valid. "
