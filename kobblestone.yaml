apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    operator: kobblestone
  name: backuprepos.kobblestone.io
spec:
  conversion:
    strategy: None
  group: kobblestone.io
  names:
    kind: BackupRepo
    listKind: BackupRepoList
    plural: backuprepos
    singular: backuprepo
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: |-
        Type of the repository.

        Values:
        - `PersistentVolumeClaim`: Configured via `persistentVolumeClaim`.
        - `S3`: Configured via `s3`.
      jsonPath: .spec.type
      name: Type
      priority: 0
      type: string
    - description: Name of the `PersistentVolumeClaim`. It is created if it does not
        exist.
      jsonPath: .spec.persistentVolumeClaim.name
      name: Claim
      priority: 0
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          A `BackupRepo` defines where `Backup`s store their snapshots.

          Types:
          - `PersistentVolumeClaim`: Snapshots are stored in a volume in the same namespace.
          - `S3`: Snapshots are uploaded to an S3-compatible bucket.

          **Note**: A volume that does not support `ReadWriteMany` can only be used by one backup, restore or snapshot cleanup at a time. Others wait until it is free.
        properties:
          spec:
            properties:
              persistentVolumeClaim:
                description: Configures the volume. Required for type `PersistentVolumeClaim`.
                nullable: true
                properties:
                  name:
                    description: Name of the `PersistentVolumeClaim`. It is created
                      if it does not exist.
                    type: string
                  size:
                    description: |-
                      Size of the `PersistentVolumeClaim`, e.g. `50Gi`.

                      Required if the claim does not exist yet. Only applied to claims created by the operator.
                    nullable: true
                    type: string
                  storageClassName:
                    description: |-
                      Storage class used if the operator creates the claim.

                      Default is the default storage class of the cluster.
                    nullable: true
                    type: string
                  subPath:
                    description: |-
                      Path inside the volume under which snapshots are stored.

                      Default is the root of the volume.
                    nullable: true
                    type: string
                required:
                - name
                type: object
              s3:
                description: Configures the bucket. Required for type `S3`.
                nullable: true
                properties:
                  bucket:
                    description: Name of the bucket.
                    type: string
                  credentialsSecretRef:
                    description: Reference to a `Secret` containing the credentials
                      in the keys `access-key` and `secret-key`.
                    properties:
                      name:
                        type: string
                    type: object
                  endpoint:
                    description: URL of the S3 endpoint.
                    type: string
                required:
                - bucket
                - credentialsSecretRef
                - endpoint
                type: object
              type:
                description: |-
                  Type of the repository.

                  Values:
                  - `PersistentVolumeClaim`: Configured via `persistentVolumeClaim`.
                  - `S3`: Configured via `s3`.
                enum:
                - PersistentVolumeClaim
                - S3
                type: string
            required:
            - type
            type: object
          status:
            properties:
              conditions:
                description: Conditions of the `BackupRepo`.
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    operator: kobblestone
  name: backups.kobblestone.io
spec:
  conversion:
    strategy: None
  group: kobblestone.io
  names:
    kind: Backup
    listKind: BackupList
    plural: backups
    singular: backup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: |-
        Current phase of the `Backup`.

        Values:
        - `Pending`: `Backup` is pending.
        - `Running`: `Backup` is currently running.
        - `Completed`: `Backup` completed successfully.
        - `Failed`: `Backup` failed.
      jsonPath: .status.phase
      name: Status
      priority: 0
      type: string
    - description: Message explaining the current state of the `Backup`.
      jsonPath: .status.message
      name: Message
      priority: 0
      type: string
    - description: Name of the target.
      jsonPath: .status.target
      name: Target
      priority: 0
      type: string
    - description: Name of the target `BackupRepo`.
      jsonPath: .status.repo
      name: Repo
      priority: 0
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          A `Backup` defines a request for a snapshot of a `Server`.

          The snapshot includes the servers data and configs. Transient data like `.jar` files is excluded.

          Backups can be restored via the `Restore` object.

          Live backups on running servers are supported and implemented using RCON.

          **Note**: Backups are not supported for servers that do **not** have storage configured.
        properties:
          spec:
            properties:
              job:
                description: Configures the spec of the managed `Job` object.
                nullable: true
                properties:
                  activeDeadlineSeconds:
                    description: |-
                      Maximum duration of the backup `Job` in seconds. When it is exceeded, the `Job` and thus the `Backup` fails.

                      Default is no limit.
                    externalDocs:
                      url: https://kubernetes.io/docs/reference/kubernetes-api/batch/job-v1/#JobSpec
                    format: int32
                    nullable: true
                    type: integer
                  image:
                    description: |-
                      Custom image for online backups of running servers.

                      Default is `itzg/mc-backup`.
                    externalDocs:
                      url: https://kubernetes.io/docs/reference/kubernetes-api/core/pod-v1/#Container
                    nullable: true
                    type: string
                  resources:
                    description: Compute resources of the backup `Pod`.
                    externalDocs:
                      url: https://kubernetes.io/docs/reference/kubernetes-api/core/pod-v1/#PodSpec
                    nullable: true
                    properties:
                      claims:
                        items:
                          properties:
                            name:
                              type: string
                            request:
                              type: string
                          type: object
                        type: array
                      limits:
                        additionalProperties:
                          type: string
                        type: object
                      requests:
                        additionalProperties:
                          type: string
                        type: object
                    type: object
                  tolerations:
                    description: Tolerations of the backup `Pod`.
                    externalDocs:
                      url: https://kubernetes.io/docs/reference/kubernetes-api/core/pod-v1/#PodSpec
                    items:
                      properties:
                        effect:
                          type: string
                        key:
                          type: string
                        operator:
                          type: string
                        tolerationSeconds:
                          format: int64
                          nullable: true
                          type: integer
                        value:
                          type: string
                      type: object
                    type: array
                title: Job
                type: object
              repoRef:
                description: Reference to the `BackupRepo` that will store the `Backup`.
                properties:
                  name:
                    type: string
                title: Repository
                type: object
              retainPolicy:
                description: |-
                  Policy that determines what should happen with the physical snapshot data when the `Backup` is deleted.

                  Values:
                  - `Retain`: Snapshots are retained in their `BackupRepo`.
                  - `Delete`: An attempt is made to delete the snapshot from the `BackupRepo`. The result of that deletion is ignored and not awaited.
                  - `RequireDelete`: The snapshot must be deleted from the `BackupRepo` for the `Backup` to be finally removed. Deletion is retried until success.

                  Default is `Retain`.
                enum:
                - Retain
                - Delete
                - RequireDelete
                nullable: true
                title: Retain Policy
                type: string
              targetRef:
                description: Reference to the target `Server`.
                properties:
                  apiGroup:
                    type: string
                  kind:
                    type: string
                  name:
                    type: string
                title: Target
                type: object
            required:
            - repoRef
            - targetRef
            type: object
          status:
            properties:
              conditions:
                description: Conditions of the `Backup`.
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  type: object
                type: array
              message:
                description: Message explaining the current state of the `Backup`.
                nullable: true
                type: string
              phase:
                description: |-
                  Current phase of the `Backup`.

                  Values:
                  - `Pending`: `Backup` is pending.
                  - `Running`: `Backup` is currently running.
                  - `Completed`: `Backup` completed successfully.
                  - `Failed`: `Backup` failed.
                enum:
                - Pending
                - Running
                - Completed
                - Failed
                type: string
              repo:
                description: Name of the target `BackupRepo`.
                nullable: true
                type: string
              startedAt:
                description: Time at which the `Job` of the `Backup` was created.
                format: date-time
                nullable: true
                type: string
              target:
                description: Name of the target.
                nullable: true
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    operator: kobblestone
  name: bots.kobblestone.io
spec:
  conversion:
    strategy: None
  group: kobblestone.io
  names:
    kind: Bot
    listKind: BotList
    plural: bots
    singular: bot
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: |-
        Current phase of the `Bot`.

        Values:
        - `Inactive`: The `Bot` is inactive (`spec.inactive`).
        - `Pending`: The `Bot` is starting or waiting for its `Account`.
        - `Connected`: The `Bot` joined its target.
        - `Disconnected`: The `Bot` lost its connection (kicked, connection lost or login rejected) and is
          restarted with backoff. `message` contains the reason.
      jsonPath: .status.phase
      name: Status
      priority: 0
      type: string
    - description: Message explaining the current state of the `Bot`.
      jsonPath: .status.message
      name: Message
      priority: 0
      type: string
    - description: Resolved address (`host:port`) of the target.
      jsonPath: .status.address
      name: Target
      priority: 0
      type: string
    - jsonPath: .spec.auth.accountRef.name
      name: Account
      priority: 0
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          A `Bot` is a single [Minecraft-Console-Client](https://github.com/MCCTeam/Minecraft-Console-Client) (MCC)
          instance connected to exactly one target.

          If the `Bot` should connect to an online server, it needs to reference an authorized `Account` (which is
          allowed to access the server). Otherwise it joins with `offlineUsername`.

          The `Bot` is programmed with MCC's own means: its configuration (`config`, TOML as in `MinecraftClient.ini`,
          e.g. to enable built-in ChatBots) and scripts (`scripts`, MCC command scripts or C# scripts).
        properties:
          spec:
            properties:
              auth:
                description: |-
                  Configures authentication for online servers.

                  If not specified, the `Bot` can only connect to offline servers.
                nullable: true
                properties:
                  accountRef:
                    description: |-
                      Reference to an `Account` in the same namespace this `Bot` authenticates with.

                      The `Bot` mounts the `Account`'s session `Secret` and is restarted whenever the session is refreshed.
                      While the `Account` is not authorized, the `Bot` stays `Pending`.
                    properties:
                      name:
                        type: string
                    type: object
                  signChat:
                    description: |-
                      Whether chat messages are signed with the `Account`'s profile key (secure chat).

                      Default is `false`.
                    nullable: true
                    type: boolean
                required:
                - accountRef
                title: Authentication
                type: object
              config:
                description: |-
                  MCC configuration in TOML (the format of `MinecraftClient.ini`).

                  Layers are merged in this order, later layers win: generated defaults, `inline`, `from` (in order),
                  generated `ScriptScheduler` tasks for `scripts` with `runOnLogin`, and finally the settings
                  managed by Kobblestone (`Main.General.Account`, `Main.General.Server`, `Main.General.AccountType`,
                  session caches and `Signature`), which cannot be overridden.

                  Tables are merged, arrays of tables (e.g. `ChatBot.ScriptScheduler.TaskList`) are concatenated.
                externalDocs:
                  url: https://mccteam.github.io/guide/configuration.html
                nullable: true
                properties:
                  from:
                    description: |-
                      MCC configuration (TOML) from keys of `ConfigMap`s or `Secret`s, merged after `inline` in order.

                      Use `Secret`s for confidential settings (e.g. tokens of chat bridges); they are mounted into the
                      `Bot` directly and never read by the operator.
                    items:
                      properties:
                        configMapKeyRef:
                          description: Key of a `ConfigMap` in the same namespace.
                          externalDocs:
                            url: https://kubernetes.io/docs/reference/kubernetes-api/core/pod-v1/#environment-variables
                          nullable: true
                          properties:
                            key:
                              type: string
                            name:
                              type: string
                            optional:
                              nullable: true
                              type: boolean
                          type: object
                        secretKeyRef:
                          description: Key of a `Secret` in the same namespace.
                          externalDocs:
                            url: https://kubernetes.io/docs/reference/kubernetes-api/core/pod-v1/#environment-variables
                          nullable: true
                          properties:
                            key:
                              type: string
                            name:
                              type: string
                            optional:
                              nullable: true
                              type: boolean
                          type: object
                      type: object
                    nullable: true
                    type: array
                  inline:
                    description: Inline MCC configuration (TOML).
                    nullable: true
                    type: string
                title: Configuration
                type: object
              inactive:
                description: |-
                  Whether the `Bot` should be inactive (not running).

                  Default is `false`.
                nullable: true
                type: boolean
              offlineUsername:
                description: |-
                  Username of the `Bot` when connecting without authentication (offline servers).

                  Ignored when `auth` is set. Default is the name of the `Bot`.
                nullable: true
