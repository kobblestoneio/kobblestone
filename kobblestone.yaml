apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    operator: kobblestone
  name: restores.kobblestone.io
spec:
  conversion:
    strategy: None
  group: kobblestone.io
  names:
    kind: Restore
    listKind: RestoreList
    plural: restores
    singular: restore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: |-
        Current phase of the `Restore`.

        Values:
        - `Pending`: The `Restore` is waiting to be started, or its `Pod` is starting.
        - `Running`: The `Restore` is currently running.
        - `Completed`: The `Restore` completed successfully.
        - `Failed`: The `Restore` failed.
      jsonPath: .status.phase
      name: Status
      priority: 0
      type: string
    - description: Message explaining the current state of the `Restore`.
      jsonPath: .status.message
      name: Message
      priority: 0
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          A `Restore` restores the data of a `Backup` into a `Server`.

          The restore waits until the `Server` is in phase `Stopped` and keeps it stopped while it runs.
          `Backup`s and `Restore`s of the same `Server` run one after another, in the order they were created.
        properties:
          spec:
            properties:
              backupRef:
                description: Reference to the `Backup` to restore.
                properties:
                  name:
                    type: string
                type: object
              existingDataPolicy:
                description: |-
                  What happens if the target already contains data.

                  Default is `Fail`.

                  Values:
                  - `Fail`: The restore fails if the target is not empty.
                  - `Overwrite`: The existing data is replaced by the data of the backup.

                  **Warning**: With `Overwrite`, the existing data is deleted. Create a `Backup` first if you might still need it.
                enum:
                - Fail
                - Overwrite
                nullable: true
                type: string
              job:
                description: Configures the spec of the managed `Job` object.
                nullable: true
                properties:
                  activeDeadlineSeconds:
                    description: |-
                      Maximum duration of the restore `Job` in seconds. When it is exceeded, the `Job` and thus the `Restore` fails.

                      Default is no limit.
                    format: int32
                    nullable: true
                    type: integer
                  image:
                    description: |-
                      Custom image for the restore containers. It must provide `sh`, `ls`, `tar` and `mv`.

                      Default is `ubuntu`.
                    nullable: true
                    type: string
                  resources:
                    description: Compute resources of the restore `Pod`.
                    nullable: true
                    properties:
                      claims:
                        items:
                          properties:
                            name:
                              type: string
                            request:
                              type: string
                          type: object
                        type: array
                      limits:
                        additionalProperties:
                          type: string
                        type: object
                      requests:
                        additionalProperties:
                          type: string
                        type: object
                    type: object
                  tolerations:
                    description: Tolerations of the restore `Pod`.
                    items:
                      properties:
                        effect:
                          type: string
                        key:
                          type: string
                        operator:
                          type: string
                        tolerationSeconds:
                          format: int64
                          nullable: true
                          type: integer
                        value:
                          type: string
                      type: object
                    nullable: true
                    type: array
                type: object
              path:
                description: |-
                  Path inside the server's data volume to restore into.

                  Default is the root of the volume.
                nullable: true
                type: string
              targetRef:
                description: |-
                  Reference to the target `Server`.

                  The `Server` must have storage configured.
                properties:
                  apiGroup:
                    type: string
                  kind:
                    type: string
                  name:
                    type: string
                type: object
            required:
            - backupRef
            - targetRef
            type: object
          status:
            properties:
              message:
                description: Message explaining the current state of the `Restore`.
                nullable: true
                type: string
              phase:
                description: |-
                  Current phase of the `Restore`.

                  Values:
                  - `Pending`: The `Restore` is waiting to be started, or its `Pod` is starting.
                  - `Running`: The `Restore` is currently running.
                  - `Completed`: The `Restore` completed successfully.
                  - `Failed`: The `Restore` failed.
                enum:
                - Pending
                - Running
                - Completed
                - Failed
                type: string
              startedAt:
                description: Time at which the `Job` of the `Restore` was created.
                format: date-time
                nullable: true
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
