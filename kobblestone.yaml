apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    operator: kobblestone
  name: servers.kobblestone.io
spec:
  conversion:
    strategy: None
  group: kobblestone.io
  names:
    kind: Server
    listKind: ServerList
    plural: servers
    singular: server
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: |-
        Current phase of the `Server`.

        Values:
        - `Stopped`: The server is stopped.
        - `Starting`: The server is starting.
        - `Running`: The server is running and ready for players.
        - `Stopping`: The server is stopping.
        - `Hibernating`: The server was stopped by auto-sleep and is started again when a player connects.
      jsonPath: .status.phase
      name: Status
      priority: 0
      type: string
    - description: Type of the server software, see `spec.type`.
      jsonPath: .status.type
      name: Type
      priority: 0
      type: string
    - description: 'IP address of the `Server`''s `Service`. External addresses are
        preferred: the IP assigned by a load balancer, then the first of `externalIPs`,
        then the cluster IP.'
      jsonPath: .status.address
      name: Address
      priority: 0
      type: string
    - description: |-
        Minecraft version of the server.

        Use `LATEST` for the latest release or `SNAPSHOT` for the latest snapshot.
      jsonPath: .spec.version
      name: Version
      priority: 0
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          A `Server` runs a single Minecraft server.

          The server is based on the [itzg/minecraft-server](https://docker-minecraft-server.readthedocs.io/) image and runs as a `StatefulSet` with one replica.
          The operator also manages its `Service`, RCON `Secret` and `NetworkPolicy` and, if configured, its `PersistentVolumeClaim`, `Route` and `TCPRoute`.

          Servers can be backed up with `Backup`s and restored with `Restore`s if they have storage configured.
        properties:
          spec:
            properties:
              access:
                description: Configures the whitelist and the operators of the server.
                nullable: true
                properties:
                  ops:
                    description: Configures the operators of the server.
                    nullable: true
                    properties:
                      users:
                        description: |-
                          Players with operator permissions, as usernames or UUIDs.

                          **Note**: The operators are synchronized: players not listed here lose their operator permissions.
                        items:
                          type: string
                        nullable: true
                        type: array
                        x-kubernetes-list-type: set
                    type: object
                  whitelist:
                    description: Configures the whitelist. Only whitelisted players
                      can join.
                    nullable: true
                    properties:
                      enforce:
                        description: |-
                          If set to `true`, online players who are not whitelisted are kicked when the whitelist changes.

                          Default is `false`.
                        nullable: true
                        type: boolean
                      users:
                        description: |-
                          Players allowed to join, as usernames or UUIDs.

                          **Note**: The whitelist is synchronized: players not listed here are removed from it.
                        items:
                          type: string
                        nullable: true
                        type: array
                        x-kubernetes-list-type: set
                    type: object
                type: object
              autoCommands:
                description: Commands executed via RCON on certain events. Each entry
                  is a single command.
                nullable: true
                properties:
                  onConnect:
                    description: Commands executed when a player connects.
                    items:
                      type: string
                    nullable: true
                    type: array
                  onDisconnect:
                    description: Commands executed when a player disconnects.
                    items:
                      type: string
                    nullable: true
                    type: array
                  onFirstConnect:
                    description: Commands executed when the first player connects
                      to the empty server.
                    items:
                      type: string
                    nullable: true
                    type: array
                  onLastDisconnect:
                    description: Commands executed when the last player disconnects.
                    items:
                      type: string
                    nullable: true
                    type: array
                  onStartup:
                    description: Commands executed once the server has started.
                    items:
                      type: string
                    nullable: true
                    type: array
                type: object
              autoSleep:
                description: Configures putting the server to sleep while no players
                  are online.
                nullable: true
                properties:
                  mode:
                    description: |-
                      How the server sleeps while no players are online.

                      Default is `Pause`.

                      Values:
                      - `None`: The server never sleeps.
                      - `Pause`: The server pauses ticking while it is empty (requires Minecraft 1.21.2 or later).
                      - `Hibernate`: The server is stopped while it is empty and started again when a player connects through a `Router`.
                      - `LegacyPause`: The server process is paused while it is empty, using the [autopause](https://docker-minecraft-server.readthedocs.io/en/latest/misc/autopause-autostop/autopause/) feature of the image. For older versions.
                    enum:
                    - None
                    - Pause
                    - Hibernate
                    - LegacyPause
                    nullable: true
                    type: string
                  timeoutSeconds:
                    description: |-
                      Time in seconds without players after which the server goes to sleep.

                      Default is `60`.
                    exclusiveMinimum: false
                    format: int32
                    minimum: 1
                    nullable: true
                    type: integer
                type: object
              content:
                description: Configures plugins, mods, modpacks and other content
                  installed on startup.
                nullable: true
                properties:
                  curseForge:
                    description: Configures content from [CurseForge](https://www.curseforge.com/).
                    nullable: true
                    properties:
                      apiKeySecretRef:
                        description: Reference to a key of a `Secret` containing a
                          CurseForge API key. Required to download from CurseForge.
                        nullable: true
                        properties:
                          key:
                            description: Name of the key.
                            type: string
                          name:
                            description: Name of the `Secret`.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      files:
                        description: CurseForge projects or files to install, by slug,
                          ID or URL.
                        items:
                          type: string
                        nullable: true
                        type: array
                        x-kubernetes-list-type: set
                      modPackUrl:
                        description: URL of the CurseForge page of a modpack to install.
                          Requires the server type `AutoCurseforge`.
                        nullable: true
                        type: string
                    type: object
                  iconUrl:
                    description: URL of an image used as the server icon.
                    nullable: true
                    type: string
                  modPackUrl:
                    description: URL of a modpack ZIP file to install.
                    nullable: true
                    type: string
                  modrinth:
                    description: Configures content from [Modrinth](https://modrinth.com/).
                    nullable: true
                    properties:
                      projects:
                        description: Modrinth projects to install, by slug or ID.
                        items:
                          type: string
                        nullable: true
                        type: array
                        x-kubernetes-list-type: set
                    type: object
                  mods:
                    description: Mods to install, for modded server types (e.g. `Fabric`).
                    items:
                      properties:
                        url:
                          description: URL of the mod `.jar` file.
                          type: string
                      required:
                      - url
                      type: object
                    nullable: true
                    type: array
                  packwizUrl:
                    description: URL of a [packwiz](https://packwiz.infra.link/) `pack.toml`
                      to install.
                    nullable: true
                    type: string
                  plugins:
                    description: Plugins to install, for server types that support
                      plugins (e.g. `Paper`).
                    items:
                      properties:
                        url:
                          description: URL of the plugin `.jar` file.
                          type: string
                      required:
                      - url
                      type: object
                    nullable: true
                    type: array
                  resourcePack:
                    description: Configures a resource pack that players are prompted
                      to download.
                    nullable: true
                    properties:
                      enforce:
                        description: |-
                          If set to `true`, players who decline the resource pack are disconnected.

                          Default is `false`.
                        nullable: true
                        type: boolean
                      sha1:
                        description: SHA-1 checksum of the resource pack. Lets clients
                          cache the pack.
                        nullable: true
                        type: string
                      url:
                        description: URL of the resource pack ZIP file.
                        type: string
                    required:
                    - url
                    type: object
                  spigotResources:
                    description: IDs of [Spigot resources](https://www.spigotmc.org/resources/)
                      to install.
                    items:
                      type: string
                    nullable: true
                    type: array
                    x-kubernetes-list-type: set
                type: object
              eula:
                description: Whether you accept the [Minecraft EULA](https://www.minecraft.net/en-us/eula).
                  The server does not start unless this is `true`.
                type: boolean
              jvm:
                description: Configures the JVM of the server.
                nullable: true
                properties:
                  memory:
                    description: Configures memory settings for the JVM.
                    nullable: true
                    properties:
                      heapPercentage:
                        description: |-
                          Configures the percentage of memory reserved for the heap.

                          Default is `75`.

                          **Note**: For low-memory servers, you might have to lower this.
                        exclusiveMaximum: false
                        exclusiveMinimum: false
                        format: int32
                        maximum: 99
                        minimum: 1
                        nullable: true
                        type: integer
                    type: object
                  version:
                    description: |-
                      Configures a specific version of the JVM to be used.

                      Default is `java25`.

                      **Note**: This corresponds to the Java part of the server image tag.
                      See [Image tags](https://docker-minecraft-server.readthedocs.io/en/latest/versions/java/#image-tags).
                    example: java25
                    nullable: true
                    type: string
                type: object
              lifecycle:
                description: Configures settings related to the lifecycle of the `Server`.
                nullable: true
                properties:
                  rolloutPolicy:
                    description: |-
                      Specifies when changes to `spec` are rolled out to running servers.

                      Default is `Immediate`.

                      Values:
                      - `Immediate`: Changes to `spec` are rolled out immediately. For example, if you update `spec.version`, the server will be restarted.
                      - `Manual`: Changes to `spec` are rolled out when the server `Pod` is recreated, e.g. when the server is stopped and started again or the `Pod` is deleted. **Note**: This does not apply to restarts of the server container after a crash.
                    enum:
                    - Immediate
                    - Manual
                    nullable: true
                    type: string
                type: object
              networkPolicy:
                description: |-
                  Configures the `NetworkPolicy` of the server.

                  By default, it only allows Minecraft traffic from `Router`s, `Network`s and `Bot`s, RCON traffic from `Backup`s, and all traffic to the `Service` if it is of type `LoadBalancer`.
                nullable: true
                properties:
                  disabled:
                    description: |-
                      If set to `true`, the server's default `NetworkPolicy` will not be created.

                      Default is `false`.
                    nullable: true
                    type: boolean
                  extraIngressRules:
                    description: Additional Ingress rules applied to the policy.
                    items:
                      properties:
                        from:
                          items:
                            properties:
                              ipBlock:
                                properties:
                                  cidr:
                                    type: string
                                  except:
                                    items:
                                      type: string
                                    type: array
                                type: object
                              namespaceSelector:
                                properties:
                                  matchExpressions:
                                    items:
                                      properties:
                                        key:
                                          type: string
                                        operator:
                                          type: string
                                        values:
                                          items:
                                            type: string
                                          type: array
                                      type: object
                                    type: array
                                  matchLabels:
                                    additionalProperties:
                                      type: string
                                    type: object
                                type: object
                              podSelector:
                                properties:
                                  matchExpressions:
                                    items:
                                      properties:
                                        key:
                                          type: string
                                        operator:
                                          type: string
                                        values:
                                          items:
                                            type: string
                                          type: array
                                      type: object
                                    type: array
                                  matchLabels:
                                    additionalProperties:
                                      type: string
                                    type: object
                                type: object
                            type: object
                          type: array
                        ports:
                          items:
                            properties:
                              endPort:
                                format: int32
                                nullable: true
                                type: integer
                              port:
                                x-kubernetes-int-or-string: true
                              protocol:
                                type: string
                            type: object
                          type: array
                      type: object
                    nullable: true
