                  Configures RCON, the remote console of the server.

                  RCON is required for `Command`s, `CommandGroup`s, `autoCommands` and online `Backup`s.
                nullable: true
                properties:
                  disabled:
                    description: |-
                      If set to `true`, RCON is disabled.

                      Default is `false`.

                      **Note**: `Command`s, `CommandGroup`s, `autoCommands` and online `Backup`s require RCON.
                    nullable: true
                    type: boolean
                  passwordSecretRef:
                    description: |-
                      Reference to a key of a `Secret` containing the RCON password.

                      If not set, a random password is generated.

                      **Note**: Only read when the server's own `Secret` is created.
                    nullable: true
                    properties:
                      key:
                        description: Name of the key.
                        type: string
                      name:
                        description: Name of the `Secret`.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  port:
                    description: |-
                      Port of RCON on the server and its `Service`.

                      Default is `25575`.
                    format: int32
                    nullable: true
                    type: integer
                type: object
              resources:
                description: Compute resources of the server container.
                nullable: true
                properties:
                  claims:
                    items:
                      properties:
                        name:
                          type: string
                        request:
                          type: string
                      type: object
                    type: array
                  limits:
                    additionalProperties:
                      type: string
                    type: object
                  requests:
                    additionalProperties:
                      type: string
                    type: object
                type: object
              route:
                description: |-
                  Configures a `Route` that makes the server reachable through a `Router` under a hostname.

                  Removing it deletes the `Route`.
                nullable: true
                properties:
                  hostname:
                    description: Hostname under which the server is reachable through
                      the `Router`.
                    type: string
                  parentRef:
                    description: Reference to the `Router` the `Route` is attached
                      to.
                    properties:
                      name:
                        type: string
                    type: object
                required:
                - hostname
                - parentRef
                type: object
              service:
                description: Configures the `Service` of the server.
                nullable: true
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: Annotations added to the server's `Service`, e.g.
                      to configure a load balancer.
                    nullable: true
                    type: object
                  externalTrafficPolicy:
                    description: External traffic policy of the server's `Service`.
                    nullable: true
                    type: string
                  ipFamilyPolicy:
                    description: IP family policy of the server's `Service`.
                    nullable: true
                    type: string
                  port:
                    description: |-
                      Port on the `Service` that exposes Minecraft.

                      Default is `25565`.
                    format: int32
                    nullable: true
                    type: integer
                  type:
                    description: |-
                      Type of the server's `Service`, e.g. `ClusterIP` or `LoadBalancer`.

                      Default is `ClusterIP`.

                      **Warning**: With `LoadBalancer`, the RCON port is reachable from anywhere as well, unless RCON is disabled.
                    nullable: true
                    type: string
                type: object
              state:
                description: |-
                  Desired state of the `Server`.

                  Default is `Running`.

                  Values:
                  - `Running`: The server is started.
                  - `Stopped`: The server is stopped. Its data is kept.

                  **Note**: The server is kept stopped while a `Restore` or an offline `Backup` of it is running.
                enum:
                - Stopped
                - Running
                nullable: true
                type: string
              storage:
                description: |-
                  Configures a persistent volume for the server's data (worlds, configuration, ...).

                  Without storage, all data is lost when the server `Pod` is recreated, and `Backup`s and `Restore`s are not supported.

                  **Warning**: Removing `storage` deletes the server's `PersistentVolumeClaim` and thus its data.
                nullable: true
                properties:
                  size:
                    description: |-
                      Size of the `PersistentVolumeClaim`, e.g. `10Gi`.

                      **Note**: Increasing the size requires a storage class that supports volume expansion.
                    type: string
                  storageClassName:
                    description: |-
                      Storage class of the `PersistentVolumeClaim`.

                      Default is the default storage class of the cluster.

                      **Note**: Only applied when the claim is created.
                    nullable: true
                    type: string
                required:
                - size
                type: object
              tcpRoute:
                description: |-
                  Configures an optional `TCPRoute` exposing the `Server`s Minecraft port.

                  **Note**: Using `TCPRoute` requires at least [Gateway API v1.6.0](https://gateway-api.sigs.k8s.io/reference/api-spec/1.6/spec/) to be installed on your cluster.
                nullable: true
                properties:
                  parentRefs:
                    description: References to gateways the `TCPRoute` should attach
                      to.
                    items:
                      properties:
                        group:
                          nullable: true
                          type: string
                        kind:
                          nullable: true
                          type: string
                        name:
                          type: string
                        namespace:
                          nullable: true
                          type: string
                        port:
                          format: int32
                          nullable: true
                          type: integer
                        sectionName:
                          nullable: true
                          type: string
                      type: object
                    nullable: true
                    type: array
                title: Gateway API
                type: object
              timeouts:
                description: Configures the health checks of the server.
                nullable: true
                properties:
                  maxStartupTimeSeconds:
                    description: |-
                      Maximum time in seconds the server may take to start before it is restarted.

                      Default is `360`. Must be a multiple of `5`.
                    format: int32
                    multipleOf: 5
                    nullable: true
                    type: integer
                  maxUnavailabilityTimeSeconds:
                    description: |-
                      Maximum time in seconds a started server may be unresponsive before it is restarted.

                      Default is `15`. Must be a multiple of `5`.
                    format: int32
                    multipleOf: 5
                    nullable: true
                    type: integer
                type: object
              type:
                description: |-
                  Type of the server software, e.g. a mod loader or plugin platform.

                  Default is `Vanilla`.

                  See [Server types](https://docker-minecraft-server.readthedocs.io/en/latest/types-and-platforms/) for details on each type.
                enum:
                - Vanilla
                - Bukkit
                - Spigot
                - Fabric
                - Forge
                - Magma
                - Ketting
                - Mohist
                - Catserver
                - Spongevanilla
                - Limbo
                - Crucible
                - Paper
                - Pufferfish
                - Purpur
                - Folia
                - Quilt
                - AutoCurseforge
                nullable: true
                type: string
              version:
                description: |-
                  Minecraft version of the server.

                  Use `LATEST` for the latest release or `SNAPSHOT` for the latest snapshot.
                type: string
            required:
            - eula
            - version
            type: object
          status:
            properties:
              address:
                description: 'IP address of the `Server`''s `Service`. External addresses
                  are preferred: the IP assigned by a load balancer, then the first
                  of `externalIPs`, then the cluster IP.'
                nullable: true
                type: string
              conditions:
                description: |-
                  Conditions of the `Server`.

                  Types: `Running`, `Stopped`, `Progressing`, `Hibernating`, `RconAvailable`, `BackupInProgress`, `RestoreInProgress`, `Error`.
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  type: object
                type: array
              phase:
                description: |-
                  Current phase of the `Server`.

                  Values:
                  - `Stopped`: The server is stopped.
                  - `Starting`: The server is starting.
                  - `Running`: The server is running and ready for players.
                  - `Stopping`: The server is stopping.
                  - `Hibernating`: The server was stopped by auto-sleep and is started again when a player connects.
                enum:
                - Stopped
                - Running
                - Starting
                - Stopping
                - Hibernating
                type: string
              tcpRoute:
                description: Whether a managed `TCPRoute` exists.
                nullable: true
                type: boolean
              type:
                description: Type of the server software, see `spec.type`.
                enum:
                - Vanilla
                - Bukkit
                - Spigot
                - Fabric
                - Forge
                - Magma
                - Ketting
                - Mohist
                - Catserver
                - Spongevanilla
                - Limbo
                - Crucible
                - Paper
                - Pufferfish
                - Purpur
                - Folia
                - Quilt
                - AutoCurseforge
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
