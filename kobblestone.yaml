apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    operator: kobblestone
  name: accounts.kobblestone.io
spec:
  conversion:
    strategy: None
  group: kobblestone.io
  names:
    kind: Account
    listKind: AccountList
    plural: accounts
    singular: account
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: |-
        Current phase of the `Account`.

        Values:
        - `Unauthorized`: The `Account` is not authorized and is currently not awaiting authorization.
        - `AwaitingAuthorization`: The `Account` awaits manual authorization via the device flow.
        - `Authorized`: The `Account` was successfully authorized and is considered ready.
      jsonPath: .status.phase
      name: Status
      priority: 0
      type: string
    - description: Message explaining the current state of the `Account`.
      jsonPath: .status.message
      name: Message
      priority: 0
      type: string
    - description: Name of the user.
      jsonPath: .status.profile.name
      name: Username
      priority: 0
      type: string
    - description: UUID of the user.
      jsonPath: .status.profile.uuid
      name: UUID
      priority: 0
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          `Account` represents a Microsoft account that can be used to authenticate against online Minecraft servers.
          They can be referenced by `Bot`s to connect to online servers.

          Once an `Account` is created, an authorization flow (OAuth device flow) is initiated.
          The field `status.deviceFlow` will contain all necessary information for users to complete the authorization.

          Once authorization is completed, the session is stored in the `Secret` named like the `Account`
          (type `kobblestone.io/minecraft-session`) in a standard, client independent format, so it can be mounted
          by any workload. The refresh token is kept separately in the internal `<account>-credentials` `Secret`.

          `Account`s automatically refresh their session before it expires for as long as the authorization state is valid.
        properties:
          spec:
            properties:
              authorization:
                description: Configurations related to the authorization flows.
                nullable: true
                properties:
                  pod:
                    description: Configures the managed `Pod` resource that is spawned
                      for authorization flows.
                    nullable: true
