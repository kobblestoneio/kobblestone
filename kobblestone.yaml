                        nullable: true
                        type: string
                      imagePullPolicy:
                        description: Image pull policy of the authorization container.
                        externalDocs:
                          url: https://kubernetes.io/docs/reference/kubernetes-api/core/pod-v1/#Container
                        nullable: true
                        type: string
                      nodeName:
                        description: Name of the node the authorization `Pod` is scheduled
                          on.
                        externalDocs:
                          url: https://kubernetes.io/docs/reference/kubernetes-api/core/pod-v1/#PodSpec
                        nullable: true
                        type: string
                      nodeSelector:
                        additionalProperties:
                          type: string
