                                      type: object
                                    type: array
                                  matchLabels:
                                    additionalProperties:
                                      type: string
                                    type: object
                                type: object
                            type: object
                          type: array
                        ports:
                          items:
                            properties:
                              endPort:
                                format: int32
                                nullable: true
                                type: integer
                              port:
                                x-kubernetes-int-or-string: true
                              protocol:
                                type: string
                            type: object
                          type: array
                      type: object
                    nullable: true
                    type: array
                type: object
              offline:
                description: |-
                  If set to `true`, the server runs in offline mode: player accounts are not verified.

                  Default is `false`.

                  **Warning**: Only use this for servers behind a proxy that verifies players (e.g. a `Network`), never for servers that players can reach directly.
                nullable: true
                type: boolean
