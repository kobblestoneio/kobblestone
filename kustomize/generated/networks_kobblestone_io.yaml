apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: networks.kobblestone.io
spec:
  conversion:
    strategy: None
  group: kobblestone.io
  names:
    kind: Network
    listKind: NetworkList
    plural: networks
    singular: network
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: "IP address of the proxy's `Service`. External addresses are preferred: the IP assigned by a load balancer, then the first of `externalIPs`, then the cluster IP."
      jsonPath: .status.address
      name: Address
      priority: 0
      type: string
    - description: |-
        Velocity version.

        Default is `LATEST`.
      jsonPath: .spec.proxy.version
      name: Version
      priority: 0
      type: string
    - description: |-
        Number of proxy replicas.

        Default is `1`.
      format: int32
      jsonPath: .spec.proxy.replicas
      name: Replicas
      priority: 0
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          A `Network` runs a [Velocity](https://papermc.io/software/velocity) proxy that connects players to multiple `Server`s or other `Network`s.

          The proxy runs as a `Deployment`. The operator also manages its `Service`, configuration and forwarding `Secret` and, if configured, its `Route` and `TCPRoute`.
        properties:
          spec:
            properties:
              proxy:
                description: Configures the Velocity proxy.
                nullable: true
                properties:
                  config:
                    description: |-
                      Custom `velocity.toml`.

                      The operator always sets `servers`, `forced-hosts` and `forwarding-secret-file` (and `online-mode` if `offline` is `true`), overriding the values given here.
                    nullable: true
                    type: string
                  content:
                    description: Configures plugins and the server icon of the proxy.
                    nullable: true
                    properties:
                      iconUrl:
                        description: URL of an image used as the server icon of the proxy.
                        nullable: true
                        type: string
                      plugins:
                        description: Plugins to install on the proxy.
                        items:
                          properties:
                            url:
                              description: URL of the plugin `.jar` file.
                              type: string
                          required:
                          - url
                          type: object
                        nullable: true
                        type: array
                    type: object
                  forwardingSecretRef:
                    description: |-
                      Reference to a key of a `Secret` containing the [forwarding secret](https://docs.papermc.io/velocity/player-information-forwarding/) shared with the backend servers.

                      If not set, a random secret is generated.

                      **Note**: Only read when the network's own `Secret` is created.
                    nullable: true
                    properties:
                      key:
                        description: Name of the key.
                        type: string
                      name:
                        description: Name of the `Secret`.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  jvm:
                    description: Configures the JVM of the proxy.
                    nullable: true
                    properties:
                      memory:
                        description: Configures memory settings for the JVM.
                        nullable: true
                        properties:
                          heapPercentage:
                            description: |-
                              Configures the percentage of memory reserved for the heap.

                              Default is `75`.

                              **Note**: For low-memory deployments, you might have to lower this.
                            exclusiveMaximum: false
                            exclusiveMinimum: false
                            format: int32
                            maximum: 99.0
                            minimum: 1.0
                            nullable: true
                            type: integer
                        type: object
                    type: object
                  offline:
                    description: |-
                      If set to `true`, the proxy runs in offline mode (`online-mode = false`): player accounts are not verified.

                      Default is `false`.
                    nullable: true
                    type: boolean
                  pod:
                    description: Configures the proxy `Pod`s.
                    nullable: true
                    properties:
                      affinity:
                        description: Affinity of the proxy `Pod`.
                        nullable: true
                        properties:
                          nodeAffinity:
                            properties:
                              preferredDuringSchedulingIgnoredDuringExecution:
                                items:
                                  properties:
                                    preference:
                                      properties:
                                        matchExpressions:
                                          items:
                                            properties:
                                              key:
                                                type: string
                                              operator:
                                                type: string
                                              values:
                                                items:
                                                  type: string
                                                type: array
                                            type: object
                                          type: array
                                        matchFields:
                                          items:
                                            properties:
                                              key:
                                                type: string
                                              operator:
                                                type: string
                                              values:
                                                items:
                                                  type: string
                                                type: array
                                            type: object
                                          type: array
                                      type: object
                                    weight:
                                      format: int32
                                      type: integer
                                  type: object
                                type: array
                              requiredDuringSchedulingIgnoredDuringExecution:
                                properties:
                                  nodeSelectorTerms:
                                    items:
                                      properties:
                                        matchExpressions:
                                          items:
                                            properties:
                                              key:
                                                type: string
                                              operator:
                                                type: string
                                              values:
                                                items:
                                                  type: string
                                                type: array
                                            type: object
                                          type: array
                                        matchFields:
                                          items:
                                            properties:
                                              key:
                                                type: string
                                              operator:
                                                type: string
                                              values:
                                                items:
                                                  type: string
                                                type: array
                                            type: object
                                          type: array
                                      type: object
                                    type: array
                                type: object
                            type: object
                          podAffinity:
                            properties:
                              preferredDuringSchedulingIgnoredDuringExecution:
                                items:
                                  properties:
                                    podAffinityTerm:
                                      properties:
                                        labelSelector:
                                          properties:
                                            matchExpressions:
                                              items:
                                                properties:
                                                  key:
                                                    type: string
                                                  operator:
                                                    type: string
                                                  values:
                                                    items:
                                                      type: string
                                                    type: array
                                                type: object
                                              type: array
                                            matchLabels:
                                              additionalProperties:
                                                type: string
                                              type: object
                                          type: object
                                        matchLabelKeys:
                                          items:
                                            type: string
                                          type: array
                                        mismatchLabelKeys:
                                          items:
                                            type: string
                                          type: array
                                        namespaceSelector:
                                          properties:
                                            matchExpressions:
                                              items:
                                                properties:
                                                  key:
                                                    type: string
                                                  operator:
                                                    type: string
                                                  values:
                                                    items:
                                                      type: string
                                                    type: array
                                                type: object
                                              type: array
                                            matchLabels:
                                              additionalProperties:
                                                type: string
                                              type: object
                                          type: object
                                        namespaces:
                                          items:
                                            type: string
                                          type: array
                                        topologyKey:
                                          type: string
                                      type: object
                                    weight:
                                      format: int32
                                      type: integer
                                  type: object
                                type: array
                              requiredDuringSchedulingIgnoredDuringExecution:
                                items:
                                  properties:
                                    labelSelector:
                                      properties:
                                        matchExpressions:
                                          items:
                                            properties:
                                              key:
                                                type: string
                                              operator:
                                                type: string
                                              values:
                                                items:
                                                  type: string
                                                type: array
                                            type: object
                                          type: array
                                        matchLabels:
                                          additionalProperties:
                                            type: string
                                          type: object
                                      type: object
                                    matchLabelKeys:
                                      items:
                                        type: string
                                      type: array
                                    mismatchLabelKeys:
                                      items:
                                        type: string
                                      type: array
                                    namespaceSelector:
                                      properties:
                                        matchExpressions:
                                          items:
                                            properties:
                                              key:
                                                type: string
                                              operator:
                                                type: string
                                              values:
                                                items:
                                                  type: string
                                                type: array
                                            type: object
                                          type: array
                                        matchLabels:
                                          additionalProperties:
                                            type: string
                                          type: object
                                      type: object
                                    namespaces:
                                      items:
                                        type: string
                                      type: array
                                    topologyKey:
                                      type: string
                                  type: object
                                type: array
                            type: object
                          podAntiAffinity:
                            properties:
                              preferredDuringSchedulingIgnoredDuringExecution:
                                items:
                                  properties:
                                    podAffinityTerm:
                                      properties:
                                        labelSelector:
                                          properties:
                                            matchExpressions:
                                              items:
                                                properties:
                                                  key:
                                                    type: string
                                                  operator:
                                                    type: string
                                                  values:
                                                    items:
                                                      type: string
                                                    type: array
                                                type: object
                                              type: array
                                            matchLabels:
                                              additionalProperties:
                                                type: string
                                              type: object
                                          type: object
                                        matchLabelKeys:
                                          items:
                                            type: string
                                          type: array
                                        mismatchLabelKeys:
                                          items:
                                            type: string
                                          type: array
                                        namespaceSelector:
                                          properties:
                                            matchExpressions:
                                              items:
                                                properties:
                                                  key:
                                                    type: string
                                                  operator:
                                                    type: string
                                                  values:
                                                    items:
                                                      type: string
                                                    type: array
                                                type: object
                                              type: array
                                            matchLabels:
                                              additionalProperties:
                                                type: string
                                              type: object
                                          type: object
                                        namespaces:
                                          items:
                                            type: string
                                          type: array
                                        topologyKey:
                                          type: string
                                      type: object
                                    weight:
                                      format: int32
                                      type: integer
                                  type: object
                                type: array
                              requiredDuringSchedulingIgnoredDuringExecution:
                                items:
                                  properties:
                                    labelSelector:
                                      properties:
                                        matchExpressions:
                                          items:
                                            properties:
                                              key:
                                                type: string
                                              operator:
                                                type: string
                                              values:
                                                items:
                                                  type: string
                                                type: array
                                            type: object
                                          type: array
                                        matchLabels:
                                          additionalProperties:
                                            type: string
                                          type: object
                                      type: object
                                    matchLabelKeys:
                                      items:
                                        type: string
                                      type: array
                                    mismatchLabelKeys:
                                      items:
                                        type: string
                                      type: array
                                    namespaceSelector:
                                      properties:
                                        matchExpressions:
                                          items:
                                            properties:
                                              key:
                                                type: string
                                              operator:
                                                type: string
                                              values:
                                                items:
                                                  type: string
                                                type: array
                                            type: object
                                          type: array
                                        matchLabels:
                                          additionalProperties:
                                            type: string
                                          type: object
                                      type: object
                                    namespaces:
                                      items:
                                        type: string
                                      type: array
                                    topologyKey:
                                      type: string
                                  type: object
                                type: array
                            type: object
                        type: object
                      image:
                        description: |-
                          Custom image for the proxy container.

                          Default is `itzg/mc-proxy`.
                        nullable: true
                        type: string
                      imagePullPolicy:
                        description: Image pull policy of the proxy container.
                        nullable: true
                        type: string
                      nodeName:
                        description: Name of the node the proxy `Pod` is scheduled on.
                        nullable: true
                        type: string
                      nodeSelector:
                        additionalProperties:
                          type: string
                        description: Node selector of the proxy `Pod`.
                        nullable: true
                        type: object
                      tolerations:
                        description: Tolerations of the proxy `Pod`.
                        items:
                          properties:
                            effect:
                              type: string
                            key:
                              type: string
                            operator:
                              type: string
                            tolerationSeconds:
                              format: int64
                              nullable: true
                              type: integer
                            value:
                              type: string
                          type: object
                        nullable: true
                        type: array
                    type: object
                  replicas:
                    description: |-
                      Number of proxy replicas.

                      Default is `1`.
                    format: int32
                    nullable: true
                    type: integer
                  resources:
                    description: Compute resources of the proxy container.
                    nullable: true
                    properties:
                      claims:
                        items:
                          properties:
                            name:
                              type: string
                            request:
                              type: string
                          type: object
                        type: array
                      limits:
                        additionalProperties:
                          type: string
                        type: object
                      requests:
                        additionalProperties:
                          type: string
                        type: object
                    type: object
                  version:
                    description: |-
                      Velocity version.

                      Default is `LATEST`.
                    nullable: true
                    type: string
                type: object
              route:
                description: |-
                  Configures a `Route` that makes the network reachable through a `Router` under a hostname.

                  Removing it deletes the `Route`.
                nullable: true
                properties:
                  hostname:
                    description: Hostname under which the network is reachable through the `Router`.
                    type: string
                  parentRef:
                    description: Reference to the `Router` the `Route` is attached to.
                    properties:
                      name:
                        type: string
                    type: object
                required:
                - hostname
                - parentRef
                type: object
              servers:
                description: |-
                  Servers the proxy forwards players to.

                  Players join the first available server in the given order, unless a forced host applies.
                items:
                  properties:
                    hostname:
                      description: Hostname that sends players directly to this server (forced host).
                      nullable: true
                      type: string
                    name:
                      description: Name of the server in the proxy, e.g. for `/server <name>`.
                      type: string
                    targetRef:
                      description: |-
                        Reference to the `Server` or `Network` to forward players to.

                        Supported kinds: `Server` (default), `Network`.
                      properties:
                        apiGroup:
                          type: string
                        kind:
                          type: string
                        name:
                          type: string
                        namespace:
                          type: string
                      type: object
                  required:
                  - name
                  - targetRef
                  type: object
                nullable: true
                type: array
              service:
                description: Configures the `Service` of the proxy.
                nullable: true
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: Annotations added to the proxy's `Service`, e.g. to configure a load balancer.
                    nullable: true
                    type: object
                  externalTrafficPolicy:
                    description: External traffic policy of the proxy's `Service`.
                    nullable: true
                    type: string
                  ipFamilyPolicy:
                    description: IP family policy of the proxy's `Service`.
                    nullable: true
                    type: string
                  port:
                    description: |-
                      Port on the `Service` that exposes Minecraft.

                      Default is `25565`.
                    format: int32
                    nullable: true
                    type: integer
                  type:
                    description: |-
                      Type of the proxy's `Service`, e.g. `ClusterIP` or `LoadBalancer`.

                      Default is `ClusterIP`.
                    nullable: true
                    type: string
                type: object
              tcpRoute:
                description: |-
                  Configures an optional `TCPRoute` exposing the `Network`s Minecraft port.

                  **Note**: Using `TCPRoute` requires at least [Gateway API v1.6.0](https://gateway-api.sigs.k8s.io/reference/api-spec/1.6/spec/) to be installed on your cluster.
                nullable: true
                properties:
                  parentRefs:
                    description: References to gateways the `TCPRoute` should attach to.
                    items:
                      properties:
                        group:
                          nullable: true
                          type: string
                        kind:
                          nullable: true
                          type: string
                        name:
                          type: string
                        namespace:
                          nullable: true
                          type: string
                        port:
                          format: int32
                          nullable: true
                          type: integer
                        sectionName:
                          nullable: true
                          type: string
                      type: object
                    nullable: true
                    type: array
                title: Gateway API
                type: object
            type: object
          status:
            properties:
              address:
                description: "IP address of the proxy's `Service`. External addresses are preferred: the IP assigned by a load balancer, then the first of `externalIPs`, then the cluster IP."
                nullable: true
                type: string
              tcpRoute:
                description: Whether a managed `TCPRoute` exists.
                nullable: true
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}