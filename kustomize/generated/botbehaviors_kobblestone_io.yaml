apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: botbehaviors.kobblestone.io
spec:
  conversion:
    strategy: None
  group: kobblestone.io
  names:
    kind: BotBehavior
    listKind: BotBehaviorList
    plural: botbehaviors
    singular: botbehavior
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A `BotBehavior` defines a piece of logic/behavior for Minecraft bots.
        properties:
          spec:
            properties:
              code:
                description: Programs the bot behavior directly using code.
                nullable: true
                properties:
                  inline:
                    description: Inline code of the behavior.
                    nullable: true
                    type: string
                type: object
              parametersSchema:
                description: Describes the behavior's parameters with a JSON schema.
                nullable: true
                type: object
                x-kubernetes-preserve-unknown-fields: true
            type: object
          status:
            properties: {}
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}