              resources:
                description: Resource requirements for the `Router` pods.
                externalDocs:
                  url: https://kubernetes.io/docs/reference/kubernetes-api/core/pod-v1/#PodSpec
                nullable: true
                properties:
                  claims:
                    items:
                      properties:
                        name:
                          type: string
                        request:
                          type: string
                      type: object
