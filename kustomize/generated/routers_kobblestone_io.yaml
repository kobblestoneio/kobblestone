                  image:
                    description: Allows specifying a custom image for the `Router` pod.
                    externalDocs:
                      url: https://kubernetes.io/docs/reference/kubernetes-api/core/pod-v1/#Container
                    nullable: true
                    type: string
                  imagePullPolicy:
                    externalDocs:
