                      url: https://kubernetes.io/docs/reference/kubernetes-api/core/pod-v1/#PodSpec
                    nullable: true
                    type: object
                  tolerations:
                    externalDocs:
                      url: https://kubernetes.io/docs/reference/kubernetes-api/core/pod-v1/#PodSpec
                    items:
                      properties:
                        effect:
                          type: string
                        key:
                          type: string
                        operator:
                          type: string
