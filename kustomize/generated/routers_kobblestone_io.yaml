                  limits:
                    additionalProperties:
                      type: string
                    type: object
                  requests:
                    additionalProperties:
                      type: string
                    type: object
                title: Resources
                type: object
              service:
                description: |-
                  Configures the spec of the managed `Service` object.

                  By default, every `Router` creates `Service` of type `ClusterIP`.

                  If you want to expose your `Router` externally, you may switch to `LoadBalancer`.
                nullable: true
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    externalDocs:
                      url: https://kubernetes.io/docs/reference/kubernetes-api/definitions/object-meta-v1-meta/#ObjectMeta
                    nullable: true
                    type: object
                  externalTrafficPolicy:
                    externalDocs:
                      url: https://kubernetes.io/docs/reference/kubernetes-api/core/service-v1/#ServiceSpec
                    nullable: true
                    type: string
                  ipFamilyPolicy:
                    externalDocs:
                      url: https://kubernetes.io/docs/reference/kubernetes-api/core/service-v1/#ServiceSpec
                    nullable: true
                    type: string
                  port:
                    description: |-
                      Port on the `Service` that exposes Minecraft.

                      Default is `25565`.
                    exclusiveMaximum: false
                    exclusiveMinimum: false
                    format: int32
                    maximum: 65535.0
                    minimum: 1.0
                    nullable: true
                    type: integer
                  type:
                    externalDocs:
                      url: https://kubernetes.io/docs/reference/kubernetes-api/core/service-v1/#ServiceSpec
                    nullable: true
                    type: string
                title: Service
                type: object
              staticRoutes:
                description: Statically defined routes that are always available on the `Router` (not defined by `Route` objects).
                items:
                  properties:
                    backend:
                      description: Address (IP+port) of the target backend.
                      example: server.example.svc.cluster.local:25565
                      type: string
                    hostname:
                      description: Hostname.
                      example: server.example.com
                      format: hostname
                      type: string
                  required:
                  - backend
                  - hostname
                  type: object
                nullable: true
                title: Static Routes
                type: array
              tcpRoute:
                description: |-
                  Configures an optional `TCPRoute` exposing the `Router`s Minecraft port.

                  **Note**: Using `TCPRoute` requires at least [Gateway API v1.6.0](https://gateway-api.sigs.k8s.io/reference/api-spec/1.6/spec/) to be installed on your cluster.
                nullable: true
                properties:
                  parentRefs:
                    description: References to gateways the `TCPRoute` should attach to.
                    items:
                      properties:
                        group:
                          nullable: true
                          type: string
                        kind:
                          nullable: true
                          type: string
                        name:
                          type: string
                        namespace:
                          nullable: true
                          type: string
                        port:
                          format: int32
                          nullable: true
                          type: integer
                        sectionName:
                          nullable: true
                          type: string
                      type: object
                    nullable: true
                    type: array
                title: Gateway API
                type: object
            type: object
          status:
            properties:
              address:
                description: IP address of the `Router`.
                nullable: true
                type: string
              conditions:
                description: Conditions of the `Router`.
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  type: object
                type: array
              tcpRoute:
                description: Whether a managed `TCPRoute` exists.
                nullable: true
                type: boolean
            type: object
        type: object
