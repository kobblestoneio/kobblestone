apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: routers.kobblestone.io
spec:
  conversion:
    strategy: None
  group: kobblestone.io
  names:
    kind: Router
    listKind: RouterList
    plural: routers
    singular: router
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: IP address of the `Router`.
      jsonPath: .status.address
      name: Address
      priority: 0
      type: string
    - description: Number of replicas this `Router` should run.
      format: int32
      jsonPath: .spec.replicas
      name: Replicas
      priority: 0
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          A `Router` defines a lightweight proxy routing Minecraft traffic based on the [Server Address](https://minecraft.wiki/w/Java_Edition_protocol/Packets#Handshake) field of handshakes.

          Usually, routers sit on the edge of your Minecraft infrastructure and may very well be exposed to the internet.

          Routes are configured via `Route` objects.
        properties:
          spec:
            properties:
              hostnames:
                description: |-
                  List of hostnames this `Router` accepts. Supports wildcard.

                  **Note**: An empty list does **not** mean "accept any", it means "accept none". Use `*` entry to accept any.
                example:
                - '*.example.com'
                - '*.foo.com'
                items:
                  type: string
                nullable: true
                title: Hostnames
                type: array
                x-kubernetes-list-type: set
              networking:
                description: Networking options.
                nullable: true
                properties:
                  allowAddresses:
                    description: List of IPs and networks (CIDR) to allow. Allows everything by default.
                    example:
                    - 1.2.3.4
                    - 0.0.0.0/0
                    items:
                      type: string
                    nullable: true
                    type: array
                    x-kubernetes-list-type: set
                  backendDialTimeout:
                    description: Configures a timeout when connecting to backend servers. Default is no timeout.
                    example: 5s
                    nullable: true
                    type: string
                  denyAddresses:
                    description: List of IPs and networks (CIDR) to deny.
                    example:
                    - 1.2.3.4
                    - 0.0.0.0/0
                    items:
                      type: string
                    nullable: true
                    type: array
                    x-kubernetes-list-type: set
                  maxConnectionsPerSecond:
                    description: |-
                      Configures the max. number of connections per second this `Router` accepts.

                      Default is `1`.
                    exclusiveMinimum: false
                    format: int32
                    minimum: 1.0
                    nullable: true
                    type: integer
                  proxyProtocol:
                    description: Configures the PROXY protocol.
                    nullable: true
                    properties:
                      receive:
                        description: |-
                          Whether the `Router` should accept the PROXY protocol.

                          Default is `false`.
                        nullable: true
                        type: boolean
                      send:
                        description: |-
                          Whether the `Router` should send the PROXY protocol to backends.

                          Default is `false`.
                        nullable: true
                        type: boolean
                      trustedProxies:
                        description: |-
                          List of trusted proxy IPs and networks (CIDR).

                          An empty list accepts all IPs.
                        items:
                          type: string
                        nullable: true
                        type: array
                        x-kubernetes-list-type: set
                    type: object
                title: Networking
                type: object
              pod:
                description: Configures the spec of the managed `Pod` objects.
                nullable: true
                properties:
                  affinity:
                    externalDocs:
                      url: https://kubernetes.io/docs/reference/kubernetes-api/core/pod-v1/#Affinity
                    nullable: true
