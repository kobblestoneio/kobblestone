apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bots.kobblestone.io
spec:
  conversion:
    strategy: None
  group: kobblestone.io
  names:
    kind: Bot
    listKind: BotList
    plural: bots
    singular: bot
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
