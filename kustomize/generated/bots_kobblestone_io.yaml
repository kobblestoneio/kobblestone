              scripts:
                description: |-
                  Script files placed in MCC's working directory, so they can be run with `/script <name>` or by
                  the `ScriptScheduler`.

                  Files ending with `.cs` are MCC C# scripts (starting with `//MCCScript 1.0`), all others MCC
                  command scripts.
                externalDocs:
                  url: https://mccteam.github.io/guide/creating-bots.html
                items:
                  properties:
                    configMapKeyRef:
                      description: Key of a `ConfigMap` in the same namespace holding the script.
                      nullable: true
                      properties:
                        key:
                          type: string
                        name:
                          type: string
                        optional:
                          nullable: true
                          type: boolean
                      type: object
                    inline:
                      description: |-
                        Inline content of the script.

                        Exactly one of `inline`, `configMapKeyRef` and `secretKeyRef` must be set.
                      nullable: true
                      type: string
                    name:
                      description: File name of the script in MCC's working directory, e.g. `farm.cs` or `greet.txt`.
                      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                      type: string
                    runOnLogin:
                      description: |-
                        Whether the script is run after every login (via MCC's `ScriptScheduler`).

                        Default is `false`.
                      nullable: true
                      type: boolean
                    secretKeyRef:
                      description: Key of a `Secret` in the same namespace holding the script.
                      nullable: true
                      properties:
                        key:
                          type: string
                        name:
                          type: string
                        optional:
                          nullable: true
                          type: boolean
                      type: object
                  required:
                  - name
                  type: object
                nullable: true
                title: Scripts
                type: array
              target:
                description: Target this `Bot` connects to.
                properties:
                  host:
                    description: |-
                      Custom host (IP or hostname) of the target server.

                      This is required when `targetRef` is not specified. Otherwise, it overrides the target host implied
                      by `targetRef`.
                    nullable: true
                    type: string
                  port:
                    description: |-
                      Custom port of the target server.

                      Can be specified together with `targetRef` to override the implied port.
                    exclusiveMaximum: false
                    exclusiveMinimum: false
                    format: int32
                    maximum: 65535.0
                    minimum: 1.0
                    nullable: true
                    type: integer
                  targetRef:
                    description: |-
                      Reference to a target object.

                      This may be one of the following types: `Server`, `Network`.

                      If you want to connect through `Router` instances, you must set the `host` parameter to a hostname
                      that routes accordingly.
                    nullable: true
                    properties:
                      apiGroup:
                        type: string
                      kind:
                        type: string
                      name:
                        type: string
                      namespace:
                        type: string
                    type: object
                title: Target
                type: object
            required:
            - target
            type: object
          status:
            properties:
              address:
                description: Resolved address (`host:port`) of the target.
                nullable: true
                type: string
              conditions:
                description: Conditions of the `Bot`.
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  type: object
                type: array
              message:
                description: Message explaining the current state of the `Bot`.
                nullable: true
                type: string
              phase:
                description: |-
                  Current phase of the `Bot`.

                  Values:
                  - `Inactive`: The `Bot` is inactive (`spec.inactive`).
                  - `Pending`: The `Bot` is starting or waiting for its `Account`.
                  - `Connected`: The `Bot` joined its target.
                  - `Disconnected`: The `Bot` lost its connection (kicked, connection lost or login rejected) and is
                    restarted with backoff. `message` contains the reason.
                enum:
                - Pending
                - Inactive
                - Connected
                - Disconnected
                type: string
              restarts:
                description: How often the bot container was restarted, e.g. after disconnects.
                format: int32
                nullable: true
                type: integer
              username:
                description: Username the `Bot` joins with.
                nullable: true
                type: string
            type: object
        required:
        - spec
        type: object
