                type: object
              inactive:
                description: |-
                  Whether this account is considered inactive and will not attempt any authorization.

                  Inactive accounts will permanently stay in phase `Unauthorized`.

                  Default is `false`.
                nullable: true
                type: boolean
              refreshBeforeExpiryMinutes:
                description: |-
                  Configures the max. leftover TTL of sessions in minutes before they are refreshed.

                  Default is `60` (1 hour).
                exclusiveMinimum: false
                format: int32
                minimum: 5.0
                nullable: true
                type: integer
            type: object
          status:
            properties:
              authorizedAt:
                description: Timestamp when this `Account` was last authorized and a session was created.
                format: date-time
                nullable: true
                type: string
              conditions:
                description: Conditions of the `Account`.
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  type: object
                type: array
              deviceFlow:
                description: |-
                  Contains information for completing the device flow authorization.

                  Only set when `status.phase` is `AwaitingAuthorization`.
                nullable: true
                properties:
                  expiresAt:
                    description: Timestamp when the code expires.
                    format: date-time
                    nullable: true
                    type: string
                  message:
                    description: Message that can be shown to the human from whom action is required.
                    nullable: true
                    type: string
                  userCode:
                    description: Code with which the flow may be authorized.
                    type: string
                  verificationUri:
                    description: URI where verification may take place.
                    format: uri
                    type: string
                required:
                - userCode
                - verificationUri
                type: object
              message:
                description: Message explaining the current state of the `Account`.
                nullable: true
                type: string
              phase:
                description: |-
                  Current phase of the `Account`.

                  Values:
                  - `Unauthorized`: The `Account` is not authorized and is currently not awaiting authorization.
                  - `AwaitingAuthorization`: The `Account` awaits manual authorization via the device flow.
                  - `Authorized`: The `Account` was successfully authorized and is considered ready.
                enum:
                - Unauthorized
                - AwaitingAuthorization
                - Authorized
                type: string
              profile:
                description: |-
                  Contains user profile information.

                  Only set when `status.phase` is `Authorized`.
                nullable: true
                properties:
                  name:
                    description: Name of the user.
                    nullable: true
                    type: string
                  uuid:
                    description: UUID of the user.
                    nullable: true
                    type: string
                type: object
              sessionExpiresAt:
                description: Timestamp when the current session expires.
                format: date-time
                nullable: true
                type: string
            type: object
