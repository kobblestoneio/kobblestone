    - description: |-
        Current phase of the `Account`.

        Values:
        - `Unauthorized`: The `Account` is not authorized and is currently not awaiting authorization.
        - `AwaitingAuthorization`: The `Account` awaits manual authorization via the device flow.
        - `Authorized`: The `Account` was successfully authorized and is considered ready.
      jsonPath: .status.phase
      name: Status
      priority: 0
      type: string
    - description: Message explaining the current state of the `Account`.
      jsonPath: .status.message
      name: Message
      priority: 0
      type: string
    - description: Name of the user.
      jsonPath: .status.profile.name
      name: Username
      priority: 0
      type: string
    - description: UUID of the user.
      jsonPath: .status.profile.uuid
      name: UUID
      priority: 0
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: "`Account` represents a Microsoft that can be used to authenticate against online Minecraft servers.\r\nThey can be referenced by `Bot`s to connect to online servers.\r\n\r\nOnce an `Account` is created, an authorization flow (OAuth device flow) is initiated.\r\nThe field `status.deviceFlow` will contain all necessary information for users to complete the authorization.\r\n\r\nOnce authorization is completed, the `Account` will store access and refresh tokens securely within a managed `Secret`. \r\n\r\n`Account`s automatically refresh their session before it expires for as long as the authorization state is valid. "
