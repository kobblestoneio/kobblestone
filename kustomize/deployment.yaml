apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator
spec:
  template:
    spec:
      containers:
        - name: operator
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 500Mi
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_URLS
              value: http://0.0.0.0:80