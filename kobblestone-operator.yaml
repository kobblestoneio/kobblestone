---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    operator: kobblestone
  name: kobblestone-operator-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kobblestone-operator-role
subjects:
- kind: ServiceAccount
  name: default
  namespace: kobblestone-system
---
apiVersion: v1
kind: Service
metadata:
  labels:
    operator: kobblestone
  name: kobblestone-operator-webhook
spec:
  ports:
  - port: 80
  selector:
    operator: kobblestone
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    operator: kobblestone
    operator-deployment: kubernetes-operator
  name: kobblestone-operator
  namespace: kobblestone-system
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      operator: kobblestone
      operator-deployment: kubernetes-operator
  template:
    metadata:
      labels:
        operator: kobblestone
        operator-deployment: kubernetes-operator
    spec:
      containers:
      - env:
        - name: ASPNETCORE_URLS
          value: http://0.0.0.0:80
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: ghcr.io/kobblestoneio/kobblestone:0.4.0-rc3
        imagePullPolicy: Always
        name: operator
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 500m
            memory: 500Mi
          requests:
            cpu: 50m
            memory: 64Mi
      terminationGracePeriodSeconds: 10
